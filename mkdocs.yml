site_name: citystats
site_description: Sandbox to test MkDocs documentation attached to GitHub releases.
repo_url: https://github.com/CamiloDiazGomezUT/mkdocs_testing
repo_name: mkdocs_testing
edit_uri: edit/main/docs/
docs_dir: docs

theme:
  name: material
  logo: assets/powerco-logo.png
  favicon: assets/favicon.png
  features:
    - content.code.copy
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - search.highlight
    - search.suggest
  # The first entry follows the operating system; the toggle cycles auto -> light -> dark
  palette:
    - media: "(prefers-color-scheme)"
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to system preference

extra_css:
  - stylesheets/powerco.css

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

hooks:
  - docs/scripts/repo_links.py

plugins:
  - search
  # The release zip is opened from disk (file://): link to page.html files and bundle search
  - offline:
      enabled: !ENV [OFFLINE, false]
  - gen-files:
      scripts:
        - docs/scripts/gen_ref_pages.py
  - literate-nav:
      nav_file: SUMMARY.md
  - section-index
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            members_order: source
            merge_init_into_class: true
            separate_signature: true
            show_root_heading: true
            show_source: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true

exclude_docs: |
  scripts/

nav:
  - Home: index.md
  - Usage: usage.md
  - Releases: releases.md
  - API Reference: reference/
