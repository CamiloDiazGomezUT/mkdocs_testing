name: Release

# Immutable releases cannot get new assets once they are published, so the release is created
# here, from a pushed tag, together with its documentation zip.
on:
  push:
    tags: ["**"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag without a release yet, e.g. v1.2.0"
        required: true
        type: string

jobs:
  release:
    name: Build documentation and create the release

    runs-on: ubuntu-24.04

    permissions:
      contents: write

    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check that the release does not exist yet
        run: |
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" > /dev/null 2>&1; then
            echo "::error::Release ${TAG} already exists. Immutable releases cannot be changed, push a new tag instead."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.TAG }}

      - name: Install Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version-file: .python-version

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0

      - name: Install the project
        run: |
          uv venv
          source .venv/bin/activate
          uv sync --extra docs

      - name: Build documentation
        env:
          DISABLE_MKDOCS_2_WARNING: "true"
          DOCS_REF: ${{ env.TAG }}
          OFFLINE: "true"
        run: |
          uv run mkdocs build --strict

      - name: Create the release with the documentation
        run: |
          (cd site && zip -qr "../docs-${TAG}.zip" .)
          gh release create "${TAG}" "docs-${TAG}.zip" --verify-tag --title "${TAG}" --generate-notes
